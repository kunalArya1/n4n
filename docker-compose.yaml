version: "3.8"

services:
  api:
    build: .
    container_name: fastapi_app
    user: root
    group_add:
      - "999"
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app/server
      - MONGO_URI=mongodb://mongodb:27017/mydb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: celery_worker
    user: root
    group_add:
      - "999"
    command: celery -A server.helper.celery_app.celery worker --loglevel=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app/server
      - MONGO_URI=mongodb://mongodb:27017/mydb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mydb
    restart: unless-stopped

volumes:
  mongodb_data: