<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <mask id="m">
      <rect width="64" height="64" fill="white"/>
      <circle cx="10" cy="32" r="9" fill="black"/>
      <circle cx="32" cy="10" r="9" fill="black"/>
      <circle cx="54" cy="32" r="9" fill="black"/>
      <circle cx="32" cy="54" r="9" fill="black"/>
    </mask>
  </defs>

  <!-- Lines masked inside circles -->
  <g mask="url(#m)">
    <line x1="10" y1="32" x2="32" y2="10" stroke="#e91e63" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="32" y1="10" x2="54" y2="32" stroke="#e91e63" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="10" y1="32" x2="32" y2="54" stroke="#e91e63" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="32" y1="54" x2="54" y2="32" stroke="#e91e63" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- Circles with NO fill (fully transparent) -->
  <circle cx="10" cy="32" r="7" stroke="#e91e63" stroke-width="5.5" fill="none"/>
  <circle cx="32" cy="10" r="7" stroke="#e91e63" stroke-width="5.5" fill="none"/>
  <circle cx="54" cy="32" r="7" stroke="#e91e63" stroke-width="5.5" fill="none"/>
  <circle cx="32" cy="54" r="7" stroke="#e91e63" stroke-width="5.5" fill="none"/>
</svg>
